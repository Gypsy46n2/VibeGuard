name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # CPython's small-object allocator has been seen to segfault at interpreter
      # shutdown on some builds while running this suite. PYTHONMALLOC=malloc costs
      # a little speed and makes the run deterministic.
      PYTHONMALLOC: malloc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  dogfood:
    name: vibeguard on itself and on the example
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: doctor
        run: vibeguard doctor

      # The gate, demonstrated on something that genuinely fails it. This step is
      # *expected* to exit 1; continue-on-error keeps the job green while leaving
      # the red step visible in the run.
      - name: gate the deliberately vulnerable example (expected to fail)
        id: gate
        continue-on-error: true
        run: vibeguard ci examples/vulnerable-app --fail-on high --output table,md

      - name: assert the gate really did fail
        run: |
          if [ "${{ steps.gate.outcome }}" != "failure" ]; then
            echo "::error::vibeguard ci passed on the deliberately vulnerable example"
            exit 1
          fi
          echo "gate failed as designed"

      # Auditing our own source is informational: VibeGuard's rules look for
      # security patterns, and a repository full of security *rules* is full of the
      # strings they match. Reported, never gated on.
      - name: audit vibeguard itself (informational)
        continue-on-error: true
        run: vibeguard audit . --output table,md,html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vibeguard-reports
          if-no-files-found: warn
          path: |
            vibeguard-report.*
            examples/vulnerable-app/vibeguard-report.*

  action:
    name: the shipped GitHub Action
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      # Uses this checkout's action.yml, so a change to it is tested by the change.
      - uses: ./
        continue-on-error: true
        with:
          path: examples/vulnerable-app
          fail-on: critical
          local-only: "true"
          artifact-name: action-smoke-report
