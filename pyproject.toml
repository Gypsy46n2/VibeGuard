[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibeguard"
version = "0.3.0"
description = "Audit, repair, and harden vibe-coded applications toward production grade."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "VibeGuard contributors" }]
keywords = ["security", "audit", "static-analysis", "hardening", "vibe-coding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "rich>=13",
    "pyyaml>=6",
    "tomli-w>=1.0",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
]

[project.optional-dependencies]
scanners = [
    "bandit",
    "detect-secrets",
    "pip-audit",
    "checkov",
    "semgrep",
]
ai = [
    "anthropic",
    # Same constraint as the dev group: two declarations of one package must not
    # disagree, or which one wins depends on install order (VG-DEPS-003).
    "httpx>=0.27",
]
# The local web UI (`vibeguard ui`). Optional on purpose: the CLI and the library
# never import these, so a plain install stays dependency-light.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    # The UI tests drive the app through fastapi's TestClient, which is httpx-based.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.scripts]
vibeguard = "vibeguard.cli:app"

[project.urls]
Homepage = "https://github.com/Gypsy46n2/VibeGuard"
Source = "https://github.com/Gypsy46n2/VibeGuard"
Issues = "https://github.com/Gypsy46n2/VibeGuard/issues"

# Third-party rule packs register themselves under this entry-point group; the
# registry (vibeguard.core.registry) discovers them at runtime:
#
#   [project.entry-points."vibeguard.rules"]
#   mypack = "mypack.rules:RULES"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeguard"]
# topics.yaml is the authoritative checklist registry (INTERFACES.md §11) and must
# ship inside the wheel; the engine reads it via importlib.resources.
# The single-file UI front end and the mascot ship inside the wheel too; the server
# reads them straight out of the installed package.
artifacts = [
    "src/vibeguard/rules/topics.yaml",
    "src/vibeguard/ui/index.html",
    "src/vibeguard/ui/assets/*.png",
]

[tool.hatch.build.targets.sdist]
include = ["src/vibeguard", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `examples/` is deliberately broken code plus machine-generated repro tests. Linting
# it would be linting the test data — and "fixing" it would delete the findings the
# integration test asserts on.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: typer declares defaults via function calls.
# UP042: INTERFACES.md mandates `class X(str, Enum)`; StrEnum is not the contract.
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["vibeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
