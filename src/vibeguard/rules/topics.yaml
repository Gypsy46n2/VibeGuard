# VibeGuard master audit checklist — authoritative topic registry.
# Every topic here MUST appear in every ScanReport.checklist with an explicit status:
# PASS | FAIL | FIXED | REVIEW_REQUIRED | NOT_APPLICABLE.  Nothing is silently skipped.
# topic_id = "<section>.<slug>".  Rules/adapters declare `topics` they evaluate.
# category: the vibeguard Category each section's findings roll up to.

