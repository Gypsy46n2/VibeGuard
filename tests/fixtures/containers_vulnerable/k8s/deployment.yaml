apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: registry.example.com/api:latest
          ports:
            - containerPort: 8000
          securityContext:
            privileged: true
