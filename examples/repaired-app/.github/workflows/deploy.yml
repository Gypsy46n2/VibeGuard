name: deploy

on:
  push:
    branches: [main]

jobs:
  ship-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t notenest .
      # No test step. Straight to production on every push to main.
      - name: Deploy
        run: |
          echo "Deploying with $DEPLOY_TOKEN"
          curl -k -X POST https://deploy.example.com/hooks/notenest
        env:
          DEPLOY_TOKEN: sk-test-EXAMPLEEXAMPLE1234
